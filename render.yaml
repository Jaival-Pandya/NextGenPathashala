services:
  - type: web
    name: nextgenpathashala
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app app db upgrade && gunicorn app:app
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nextgenpathashala-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: PILOT_ADMIN_EMAIL
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: AUTO_CREATE_DB
        value: "false"
      - key: RATELIMIT_STORAGE_URI
        value: memory://

databases:
  - name: nextgenpathashala-db
    databaseName: nextgenpathashala
    user: nextgenpathashala
